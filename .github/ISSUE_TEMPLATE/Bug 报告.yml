  ## 部署方式

  - [ ] 只部署了 `strings.txt` 补丁
  - [ ] 部署了 `zh-cn.js`（**必须两个 webroot 都放**）
  - [ ] 部署了 `zh-plugin-sync`
  - [ ] 已挂开机自启（`start_pre()`）
  - [ ] 重启过 LMS

  ---

  ## 诊断信息

  请贴出以下命令的输出，能极大加快排查（见 [docs/troubleshooting.md](../blob/master/docs/troubleshooting.md)）：

  ```bash
  # LMS 与播放器状态
  ssh daphile '/etc/init.d/mediaserver status; ps aux | grep -c "[s]queezelite"'

  # 词表条目数
  ssh daphile 'grep -c ZH_CN /opt/mediaserver/strings.txt'

  # zh-cn.js 两个位置是否都在
  ssh daphile 'ls -la /var/www/localhost/htdocs/js/zh-cn.js \
                            /opt/mediaserver/HTML/Daphile/js/zh-cn.js'

  # 同步器最近日志
  ssh daphile 'tail -20 /var/log/zh-plugin-sync.log'
  ```

  ---

  ## 页面 HTML 中的实际情况

  在出问题的页面按 F12 → Elements，或：

  ```bash
  curl -s "http://<host>:9000/<出问题的页面路径>" | grep -c 'zh-cn.js'
  ```

  - [ ] 输出 1（zh-cn.js 已注入）
  - [ ] 输出 0（未注入 —— 路径或 webroot 问题）

  ---

